<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner Animation</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 481 / 272;
    background-image: url('public/qr-reference.png');
    background-size: 100% 100%;
  }
  .svg-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .scan-line {
    animation: scanSweep 2.2s linear infinite;
  }
  @keyframes scanSweep {
    0% { transform: translateY(-0.3px); }
    100% { transform: translateY(1px); }
  }
</style>
</head>
<body>
  <div class="container">
    <svg class="svg-overlay" viewBox="0 0 481 272" preserveAspectRatio="none">
      <defs>
        <clipPath id="qr-clip">
          <rect x="0" y="0" width="1" height="1" />
        </clipPath>
        
        <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,106,31,0)" />
          <stop offset="50%" stop-color="#ff6a1f" />
          <stop offset="100%" stop-color="rgba(255,106,31,0)" />
        </linearGradient>

        <linearGradient id="glow-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,106,31,0)" />
          <stop offset="100%" stop-color="rgba(255,106,31,0.5)" />
        </linearGradient>
      </defs>
      
      <g transform="matrix(26 17.75 -27.1 18.1 144 130)">
        <g clip-path="url(#qr-clip)">
          <g class="scan-line">
            <rect x="0" y="-0.3" width="1" height="0.3" fill="url(#glow-grad)" />
            <rect x="0" y="0" width="1" height="0.05" fill="url(#line-grad)" />
          </g>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
